name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      # The framework (agent-loop-studio) and the community library (agent-loop-community) are submodules.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            agent-loop-studio/package-lock.json
      - run: npm ci
      - run: npm --prefix agent-loop-studio ci
      - run: npm run build:framework
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run pack:contrejour
      - run: node tools/library-check.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: contrejour
          path: artifacts/contrejour-*
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        file:
          [
            test_a0.ts,
            test_tester_facility.ts,
            test_setup.ts,
            test_validation.ts,
            test_framework.ts,
            test_contribution.ts,
            test_loop_view.ts,
            test_studio.ts,
            test_studio_authoring.ts,
          ]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            agent-loop-studio/package-lock.json
      - run: npm ci
      - run: npm --prefix agent-loop-studio ci
      - run: npm run build:framework
      - run: npm run build
      - run: npm run test -- tests/${{ matrix.file }}
